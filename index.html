<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘의 초성게임 · 거북이 레이스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fff8ec; --ink:#2b2335; --card:#ffffff; --accent:#ff6b4a; --accent2:#3d7cf0;
    --soft:#ffe8cc; --muted:#8a8095; --ok:#2fb67c; --warn:#f2a516; --danger:#e8453c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    background:var(--bg);
    background-image:radial-gradient(circle at 10% 10%, #ffe1c2 0 120px, transparent 121px),
                     radial-gradient(circle at 95% 90%, #dbe7ff 0 160px, transparent 161px);
    background-attachment:fixed;
    color:var(--ink); font-family:'Noto Sans KR',sans-serif;
    display:flex; flex-direction:column; align-items:center; padding:20px 14px 40px;
  }
  .jua{font-family:'Jua',sans-serif; font-weight:400}
  h1{font-family:'Jua',sans-serif; font-weight:400; font-size:clamp(32px,6vw,60px); margin:6px 0 18px; text-align:center}
  h1 .q{color:var(--accent); display:inline-block; animation:bob 1.6s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-6px) rotate(8deg)}}
  .screen{width:100%; max-width:1180px; display:none}
  .screen.on{display:block}
  .panel{background:var(--card); border-radius:28px; padding:24px; box-shadow:0 10px 0 #f1dcc0, 0 18px 40px rgba(60,40,20,.08)}
  button{font-family:'Jua',sans-serif; font-size:22px; border:none; cursor:pointer; border-radius:18px; padding:14px 26px; transition:transform .08s, box-shadow .08s; color:var(--ink)}
  button:active{transform:translateY(4px)}
  button:disabled{opacity:.55; cursor:default}
  input{font-family:'Jua',sans-serif; font-size:26px; padding:10px 16px; border:4px solid #eadbc8; border-radius:16px; outline:none; color:var(--ink); background:#fffdf9; min-width:0}
  input:focus{border-color:var(--accent2)}
  input:disabled{background:#f5f1ec; color:#bbb}

  /* 메인 */
  .home{max-width:560px; margin:0 auto; text-align:center}
  .home .turtle-hero{font-size:80px; display:inline-block; transform:scaleX(-1); animation:walk 2.4s ease-in-out infinite}
  @keyframes walk{0%,100%{transform:scaleX(-1) translateX(0)}50%{transform:scaleX(-1) translateX(-24px) rotate(-6deg)}}
  .home p{color:var(--muted); margin:6px 0 24px}
  .home .col{display:flex; flex-direction:column; gap:14px}
  .btn-teacher{background:#fff; border:3px solid var(--ink); box-shadow:0 5px 0 var(--ink)}
  .btn-student{background:var(--accent2); color:#fff; box-shadow:0 6px 0 #2a5bc0; font-size:26px}
  .btn-reopen{background:var(--soft); box-shadow:0 5px 0 #ecd0ab; font-size:18px}
  .conn{margin-top:18px; font-size:14px; color:var(--muted)}
  .conn.err{color:var(--danger); font-weight:700}

  /* 입장 */
  .join{max-width:480px; margin:0 auto}
  .join h2{font-family:'Jua',sans-serif; font-weight:400; font-size:30px; margin:0 0 16px; text-align:center}
  .join label{display:block; font-family:'Jua',sans-serif; font-size:18px; color:var(--muted); margin:10px 0 6px}
  .join input{width:100%}
  .join .pin{font-size:34px; letter-spacing:.3em; text-align:center}
  .join .row{display:flex; gap:10px}
  .join .row input{font-size:22px} .join .row input:first-child{width:42%}
  .join .go{width:100%; margin-top:20px; background:var(--accent); color:#fff; box-shadow:0 6px 0 #c94a2d; font-size:28px}
  .back{background:none; color:var(--muted); font-size:17px; padding:8px; margin-top:10px; width:100%}

  /* 상단 바 */
  .topbar{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:18px}
  .pinbox{background:var(--ink); color:#fff; border-radius:20px; padding:10px 22px; font-family:'Jua',sans-serif; font-size:22px}
  .pinbox b{font-weight:400; font-size:38px; letter-spacing:.12em; color:#ffd166; margin-left:8px}
  .who{font-family:'Jua',sans-serif; font-size:24px; background:#fff; border-radius:18px; padding:10px 18px; box-shadow:0 5px 0 #f1dcc0}
  .who small{color:var(--muted); font-size:16px; margin-left:6px}
  .topbtns{display:flex; gap:8px; flex-wrap:wrap}
  .small{font-size:16px; padding:9px 15px; background:#efe9f2; box-shadow:0 4px 0 #d4c9da}
  .small.armed{background:var(--danger); color:#fff; box-shadow:0 4px 0 #a92e27}

  .grid{display:grid; grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr); gap:22px}
  @media (max-width:820px){.grid{grid-template-columns:1fr}}

  /* 초성 카드 */
  .tiles{display:flex; justify-content:center; gap:clamp(14px,3vw,32px); margin:4px 0 22px}
  .tile{
    width:clamp(120px,20vw,210px); aspect-ratio:1; border-radius:28px;
    background:linear-gradient(160deg,#fff 0%,#fff3e3 100%);
    border:5px solid var(--ink); box-shadow:0 10px 0 var(--ink);
    display:flex; align-items:center; justify-content:center;
    font-family:'Jua',sans-serif; font-size:clamp(78px,14vw,156px); line-height:1; user-select:none;
  }
  .tile.spin{color:var(--muted)}
  .tile.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
  .tile.a.done{color:var(--accent)} .tile.b.done{color:var(--accent2)}
  .tile.empty{color:#e3d6c6}
  @keyframes pop{0%{transform:scale(.7)}100%{transform:scale(1)}}
  .btnrow{display:flex; gap:12px; justify-content:center; flex-wrap:wrap}
  .big{background:var(--accent); color:#fff; font-size:30px; padding:16px 44px; box-shadow:0 6px 0 #c94a2d}
  .opts{display:flex; gap:10px 18px; flex-wrap:wrap; justify-content:center; margin-top:18px; color:var(--muted); font-size:15px}
  .opts label{display:flex; align-items:center; gap:6px; cursor:pointer}
  .opts input[type=checkbox]{width:18px; height:18px; accent-color:var(--accent)}
  .opts select{font-family:'Jua',sans-serif; font-size:16px; padding:3px 8px; border-radius:10px; border:2px solid #eadbc8; background:#fff}

  /* 타이머 */
  .timer{display:flex; flex-direction:column; align-items:center}
  .timer h2{font-family:'Jua',sans-serif; font-weight:400; font-size:26px; margin:0 0 12px}
  .ring{position:relative; width:min(240px,64vw); aspect-ratio:1}
  .ring svg{width:100%; height:100%; transform:rotate(-90deg)}
  .ring .track{stroke:#f1e6d8}
  .ring .bar{stroke:var(--ok); transition:stroke-dashoffset .25s linear, stroke .3s}
  .ring .time{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:'Jua',sans-serif; font-size:clamp(52px,8vw,72px)}
  .ring.ending .time{color:var(--danger); animation:pulse 1s ease-in-out infinite}
  .ring.over .time{font-size:clamp(34px,5vw,44px); color:var(--danger)}
  @keyframes pulse{50%{transform:scale(1.08)}}
  .adj{display:flex; gap:10px; margin:16px 0 10px}
  .adj button{background:var(--soft); padding:8px 16px; font-size:19px; box-shadow:0 4px 0 #ecd0ab}
  .presets{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-bottom:14px}
  .presets button{background:#eef3ff; color:var(--accent2); font-size:17px; padding:8px 13px; box-shadow:0 4px 0 #cbd9fb}
  .presets button.on{background:var(--accent2); color:#fff; box-shadow:0 4px 0 #2a5bc0}
  .tctl{display:flex; gap:10px}
  .tctl .go{background:var(--ok); color:#fff; box-shadow:0 6px 0 #1f8a5b; min-width:120px}
  .tctl .go.pause{background:var(--warn); box-shadow:0 6px 0 #c4850b}
  .tctl .reset{background:#efe9f2; box-shadow:0 6px 0 #d4c9da}
  .flash{animation:flash .5s ease 3}
  @keyframes flash{50%{background:#ffe0dc}}

  /* 거북이 레이스 */
  .race{margin-top:22px}
  .race-head{display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:12px}
  .race-head h2{font-family:'Jua',sans-serif; font-weight:400; font-size:28px; margin:0}
  .race-head span{color:var(--muted); font-size:15px}
  .track{border-radius:22px; overflow:hidden; border:4px solid #b9dba8; background:#cfeabf}
  .lane{position:relative; height:62px; display:flex; align-items:center}
  .lane:nth-child(odd){background:#d9f0cb}
  .lane:nth-child(even){background:#c8e6b6}
  .lane + .lane{border-top:2px dashed rgba(255,255,255,.85)}
  .lane.me{background:#cfe0ff !important; box-shadow:inset 6px 0 0 var(--accent2)}
  .lane .label{position:absolute; left:12px; width:150px; font-family:'Jua',sans-serif; font-size:19px; line-height:1.1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .lane .label small{display:block; color:#5e7a52; font-size:14px}
  .lane .road{position:absolute; left:170px; right:64px; top:0; bottom:0}
  .lane .finish{position:absolute; right:0; top:0; bottom:0; width:64px;
    background:repeating-conic-gradient(#2b2335 0 25%, #fff 0 50%) 0 0/16px 16px; opacity:.8}
  .turtle{position:absolute; top:50%; left:0; transform:translateY(-50%); display:flex; align-items:center; gap:4px;
    transition:left .9s cubic-bezier(.3,1.25,.5,1); white-space:nowrap}
  .turtle .t{font-size:40px; display:inline-block; transform:scaleX(-1)}
  .turtle.crawl .t{animation:crawl .9s ease}
  @keyframes crawl{0%,100%{transform:scaleX(-1) rotate(0)}20%{transform:scaleX(-1) translateY(-6px) rotate(-14deg)}45%{transform:scaleX(-1) rotate(10deg)}70%{transform:scaleX(-1) translateY(-3px) rotate(-8deg)}}
  .turtle .cnt{font-family:'Jua',sans-serif; font-size:18px; background:#fff; border-radius:999px; padding:1px 10px; box-shadow:0 2px 0 rgba(0,0,0,.12)}
  .turtle .crown{position:absolute; left:8px; top:-14px; font-size:20px}
  .track .empty{padding:26px; text-align:center; color:#5e7a52; font-size:16px}
  @media (max-width:640px){
    .lane .label{width:88px; font-size:16px} .lane .road{left:96px; right:40px} .lane .finish{width:40px}
    .turtle .t{font-size:32px}
  }

  /* 학생 화면 */
  .stu-grid{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:22px}
  @media (max-width:820px){.stu-grid{grid-template-columns:1fr}}
  .stu-game .tiles .tile{width:clamp(96px,26vw,160px); font-size:clamp(64px,17vw,120px); box-shadow:0 8px 0 var(--ink)}
  .stu-time{text-align:center; font-family:'Jua',sans-serif; font-size:44px; margin-bottom:4px}
  .stu-time.ending{color:var(--danger); animation:pulse 1s infinite}
  .status{font-size:16px; color:var(--muted); text-align:center; min-height:24px; margin-bottom:12px}
  .status.live{color:var(--ok); font-weight:700}
  .field{display:flex; gap:10px}
  .field input{flex:1; font-size:30px}
  .field button{background:var(--accent2); color:#fff; box-shadow:0 5px 0 #2a5bc0}
  .field input.bad{border-color:var(--danger); animation:shake .3s}
  .field input.good{border-color:var(--ok)}
  @keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .msg{min-height:26px; font-size:17px; font-weight:700; margin:10px 0}
  .msg.ok{color:var(--ok)} .msg.err{color:var(--danger)}
  .mine{background:#fbf6ef; border-radius:18px; padding:14px 16px}
  .mine .h{font-family:'Jua',sans-serif; font-size:19px; margin-bottom:8px}
  .mine .h b{color:var(--accent); font-weight:400}
  .words{display:flex; flex-wrap:wrap; gap:8px; min-height:34px}
  .word{font-family:'Jua',sans-serif; font-size:21px; background:#fff; border:2px solid #eadbc8; padding:3px 12px; border-radius:12px}
  .word .x{color:#c3b6a6; cursor:pointer; margin-left:6px; font-size:16px}

  /* 결과 */
  .overlay{position:fixed; inset:0; background:rgba(43,35,53,.55); display:none; align-items:center; justify-content:center; padding:16px; z-index:20}
  .overlay.show{display:flex}
  .modal{background:var(--card); border-radius:30px; padding:26px; width:min(860px,100%); max-height:94vh; overflow:auto; text-align:center; animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
  .modal h2{font-family:'Jua',sans-serif; font-weight:400; font-size:clamp(28px,5vw,42px); margin:0}
  .modal .sub{color:var(--muted); margin:6px 0 18px}
  .podium{display:flex; align-items:flex-end; justify-content:center; gap:12px; margin-bottom:16px}
  .pcol{flex:1; max-width:240px; display:flex; flex-direction:column; align-items:center}
  .pcol .names{font-family:'Jua',sans-serif; font-size:clamp(19px,3vw,28px); line-height:1.25; margin-bottom:4px; word-break:keep-all}
  .pcol .n{font-size:16px; color:var(--muted); margin-bottom:8px}
  .pcol .step{width:100%; border-radius:18px 18px 0 0; display:flex; justify-content:center; padding-top:8px; font-family:'Jua',sans-serif; font-size:44px; color:#fff}
  .p1 .step{height:160px; background:#f5b301} .p2 .step{height:118px; background:#a7b2c2} .p3 .step{height:84px; background:#d08a4f}
  .pcol.none .names{color:#d3c7b8}
  .detail{text-align:left; border-top:2px dashed #eadbc8; padding-top:12px}
  .detail .row{margin-bottom:9px}
  .detail .row b{font-family:'Jua',sans-serif; font-weight:400; font-size:19px; margin-right:8px}
  .detail .row span{color:var(--muted)}
  .modal .close{margin-top:14px; background:var(--accent2); color:#fff; box-shadow:0 5px 0 #2a5bc0}
  .pw-modal{max-width:380px}
  .pw-modal input{width:100%; text-align:center; font-size:34px; letter-spacing:.4em; margin:16px 0 20px}
  .pw-modal .row{display:flex; gap:10px} .pw-modal .row button{flex:1}
  .pw-ok{background:var(--ink); color:#fff}
  .pw-cancel{background:#efe9f2}
  .confetti{position:fixed; top:-20px; width:10px; height:16px; z-index:30; pointer-events:none; animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

  #toast{position:fixed; left:50%; bottom:34px; transform:translateX(-50%); background:var(--ink); color:#fff; padding:14px 26px; border-radius:999px;
    font-weight:700; font-size:18px; opacity:0; pointer-events:none; transition:opacity .25s; z-index:40; max-width:90vw; text-align:center}
  #toast.show{opacity:1} #toast.err{background:var(--danger)}
</style>
</head>
<body>

<h1>오늘의 초성게임은<span class="q">?</span></h1>

<!-- 메인 -->
<section class="screen on" id="sHome">
  <div class="panel home">
    <div class="turtle-hero">🐢</div>
    <p>단어를 하나 쓸 때마다 내 거북이가 한 칸씩 기어가요!</p>
    <div class="col">
      <button class="btn-student" id="goJoin">🙋 학생: 입장하기</button>
      <button class="btn-teacher" id="goTeacher">👩‍🏫 교사용: 방 만들기</button>
      <button class="btn-reopen" id="reopen" style="display:none"></button>
    </div>
    <div class="conn" id="conn">서버에 연결하는 중…</div>
  </div>
</section>

<!-- 학생 입장 -->
<section class="screen" id="sJoin">
  <form class="panel join" id="joinForm" autocomplete="off">
    <h2>🐢 게임 입장</h2>
    <label for="jPin">방 번호</label>
    <input id="jPin" class="pin" inputmode="numeric" maxlength="5" placeholder="00000">
    <label>학번 · 이름</label>
    <div class="row">
      <input id="jSid" inputmode="numeric" maxlength="10" placeholder="학번">
      <input id="jName" maxlength="10" placeholder="이름">
    </div>
    <button class="go" type="submit" id="joinBtn">입장하기</button>
    <button class="back" type="button" data-home>← 처음으로</button>
  </form>
</section>

<!-- 교사 화면 -->
<section class="screen" id="sTeacher">
  <div class="topbar">
    <div class="pinbox">방 번호<b id="tPin">-----</b></div>
    <div class="who" id="tCount">참가 0명</div>
    <div class="topbtns">
      <button class="small" id="tResult">결과 보기</button>
      <button class="small" id="tKick">참가자 모두 내보내기</button>
      <button class="small" data-home>나가기</button>
    </div>
  </div>
  <div class="grid">
    <section class="panel">
      <div class="tiles">
        <div class="tile a empty" id="t1">?</div>
        <div class="tile b empty" id="t2">?</div>
      </div>
      <div class="btnrow"><button class="big" id="draw">초성 뽑기!</button></div>
      <div class="opts">
        <label><input type="checkbox" id="optEasy"> 어려운 초성(ㅋ·ㅌ·ㅍ) 빼기</label>
        <label><input type="checkbox" id="optSame"> 같은 초성 두 번 안 나오게</label>
        <label><input type="checkbox" id="optAuto" checked> 뽑으면 타이머 자동 시작</label>
        <label>결승선 <select id="goal"><option>5</option><option>8</option><option selected>10</option><option>15</option><option>20</option></select> 개</label>
      </div>
    </section>
    <section class="panel timer" id="timerPanel">
      <h2>⏱ 타이머</h2>
      <div class="ring" id="ring">
        <svg viewBox="0 0 120 120">
          <circle class="track" cx="60" cy="60" r="52" fill="none" stroke-width="12"/>
          <circle class="bar" id="bar" cx="60" cy="60" r="52" fill="none" stroke-width="12" stroke-linecap="round"/>
        </svg>
        <div class="time" id="time">1:00</div>
      </div>
      <div class="adj"><button id="minus">−10초</button><button id="plus">+10초</button></div>
      <div class="presets" id="presets">
        <button data-s="30">30초</button><button data-s="60" class="on">1분</button>
        <button data-s="90">1분 30초</button><button data-s="120">2분</button><button data-s="180">3분</button>
      </div>
      <div class="tctl"><button class="go" id="go">시작</button><button class="reset" id="reset">처음으로</button></div>
    </section>
  </div>
  <section class="panel race">
    <div class="race-head"><h2>🐢 거북이 레이스</h2><span id="tRaceInfo">단어 1개 = 한 걸음</span></div>
    <div class="track" id="tTrack"></div>
  </section>
</section>

<!-- 학생 화면 -->
<section class="screen" id="sStudent">
  <div class="topbar">
    <div class="who" id="sWho"></div>
    <div class="topbtns"><button class="small" data-home>나가기</button></div>
  </div>
  <div class="stu-grid">
    <section class="panel stu-game">
      <div class="tiles">
        <div class="tile a empty" id="s1">?</div>
        <div class="tile b empty" id="s2">?</div>
      </div>
      <div class="stu-time" id="sTime">-:--</div>
      <div class="status" id="sStatus">선생님이 초성을 뽑을 때까지 기다려 주세요.</div>
      <form class="field" id="wordForm" autocomplete="off">
        <input id="word" maxlength="10" placeholder="두 글자 단어" disabled autocapitalize="off" autocorrect="off" spellcheck="false">
        <button type="submit" id="wordBtn" disabled>입력</button>
      </form>
      <div class="msg" id="msg"></div>
      <div class="mine">
        <div class="h">내가 쓴 단어 <b id="myN">0</b>개</div>
        <div class="words" id="myWords"></div>
      </div>
    </section>
    <section class="panel">
      <div class="race-head"><h2>🐢 거북이 레이스</h2><span id="sRaceInfo"></span></div>
      <div class="track" id="sTrack"></div>
    </section>
  </div>
</section>

<!-- 결과 -->
<div class="overlay" id="resOverlay">
  <div class="modal">
    <h2>🏆 이번 판 결과</h2>
    <div class="sub" id="resSub"></div>
    <div class="podium" id="podium"></div>
    <div class="detail" id="detail"></div>
    <button class="close" id="resClose">닫기</button>
  </div>
</div>

<!-- 교사 비밀번호 -->
<div class="overlay" id="pwOverlay">
  <form class="modal pw-modal" id="pwForm" autocomplete="off">
    <h2>관리자 비밀번호</h2>
    <input id="pwInput" type="password" inputmode="numeric" placeholder="****">
    <div class="row"><button type="button" class="pw-cancel" id="pwCancel">취소</button><button type="submit" class="pw-ok">확인</button></div>
  </form>
</div>

<div id="toast"></div>

<script type="module">
// ============================================================
// ★ 1. Firebase 프로젝트 설정값 (Firebase 콘솔 > 프로젝트 설정 > 내 앱 > SDK 설정 및 구성)

// ---------------- 저장소 (Firebase / 테스트용 mock) ----------------
async function makeStore(){
  if (new URLSearchParams(location.search).has('mock')) return mockStore();
  const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
  const { getAuth, signInAnonymously } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js");
  const fs = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = fs.getFirestore(app);
  await signInAnonymously(auth);
  const roomRef = pin => fs.doc(db, ROOT, pin);
  const stuCol = pin => fs.collection(db, ROOT, pin, 'students');
  return {
    async getRoom(pin){ const s = await fs.getDoc(roomRef(pin)); return s.exists() ? s.data() : null; },
    setRoom(pin, data, merge = true){ return fs.setDoc(roomRef(pin), data, { merge }); },
    watchRoom(pin, cb, err){ return fs.onSnapshot(roomRef(pin), s => cb(s.exists() ? s.data() : null), err); },
    setStudent(pin, key, data){ return fs.setDoc(fs.doc(db, ROOT, pin, 'students', key), data, { merge: true }); },
    watchStudents(pin, cb, err){ return fs.onSnapshot(stuCol(pin), s => { const a = []; s.forEach(d => a.push({ key: d.id, ...d.data() })); cb(a); }, err); },
    async clearStudents(pin){
      const s = await fs.getDocs(stuCol(pin)); const b = fs.writeBatch(db);
      s.forEach(d => b.delete(d.ref)); await b.commit();
    }
  };
}

// 테스트용: 같은 브라우저 탭끼리 localStorage로 공유 (주소 끝에 ?mock 을 붙였을 때만)
function mockStore(){
  const K = 'chosungMock';
  const load = () => { try { return JSON.parse(localStorage.getItem(K)) || {}; } catch { return {}; } };
  const save = d => { localStorage.setItem(K, JSON.stringify(d)); fire(); };
  const subs = new Set();
  const fire = () => subs.forEach(f => f());
  window.addEventListener('storage', e => { if (e.key === K) fire(); });
  const sub = f => { subs.add(f); setTimeout(f, 0); return () => subs.delete(f); };
  return {
    async getRoom(pin){ return load()[pin]?.room || null; },
    async setRoom(pin, data, merge = true){ const d = load(); d[pin] = d[pin] || { room: null, students: {} }; d[pin].room = merge ? { ...(d[pin].room || {}), ...data } : data; save(d); },
    watchRoom(pin, cb){ return sub(() => cb(load()[pin]?.room || null)); },
    async setStudent(pin, key, data){ const d = load(); d[pin] = d[pin] || { room: null, students: {} }; d[pin].students[key] = { ...(d[pin].students[key] || {}), ...data }; save(d); },
    watchStudents(pin, cb){ return sub(() => { const s = load()[pin]?.students || {}; cb(Object.entries(s).map(([key, v]) => ({ key, ...v }))); }); },
    async clearStudents(pin){ const d = load(); if (d[pin]) d[pin].students = {}; save(d); }
  };
}

const $ = id => document.getElementById(id);
const ALL = ['ㄱ','ㄴ','ㄷ','ㄹ','ㅁ','ㅂ','ㅅ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const HARD = ['ㅋ','ㅌ','ㅍ'];
const CHO = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const choOf = ch => { const c = ch.charCodeAt(0) - 0xAC00; return (c >= 0 && c <= 11171) ? CHO[Math.floor(c / 588)] : null; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pick = a => a[Math.floor(Math.random() * a.length)];
const fmt = s => { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const ls = { get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }, set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

function toast(t, err){ const el = $('toast'); el.textContent = t; el.className = 'show' + (err ? ' err' : ''); clearTimeout(toast.t); toast.t = setTimeout(() => el.className = '', 2600); }

// 같은 문서에는 한 번에 하나씩 쓰기 (마지막 값만 반영)
function writer(fn){
  let busy = false, next = null;
  const run = async () => {
    if (busy || !next) return;
    busy = true; const d = next; next = null;
    try { await fn(d); } catch (e) { console.error(e); toast('저장에 실패했어요. 인터넷 연결을 확인하세요.', true); }
    busy = false; run();
  };
  return d => { next = next ? { ...next, ...d } : d; run(); };
}

// 소리
let actx = null;
function audio(){ try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch { actx = null; } }
function beep(f = 660, d = .08, v = .15, type = 'square'){
  if (!actx) return;
  try { const o = actx.createOscillator(), g = actx.createGain(); o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(v, actx.currentTime); g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + d);
    o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + d); } catch {}
}

// 학생 단어 중 지금 초성에 맞는 것만 센다 (중복 제외)
function validWords(st){
  if (!room || !room.pair || st.round !== room.round || !Array.isArray(st.words)) return [];
  const seen = new Set();
  return st.words.filter(w => {
    if (typeof w !== 'string') return false;
    const c = [...w];
    if (c.length !== 2 || choOf(c[0]) !== room.pair[0] || choOf(c[1]) !== room.pair[1] || seen.has(w)) return false;
    seen.add(w); return true;
  });
}
function ranked(){
  const arr = students.map(s => ({ ...s, valid: validWords(s) })).map(s => ({ ...s, n: s.valid.length }));
  arr.sort((a, b) => b.n - a.n || String(a.studentId).localeCompare(String(b.studentId), 'ko', { numeric: true }));
  let rank = 0, prev = null;
  arr.forEach((r, i) => { if (r.n !== prev){ rank = i + 1; prev = r.n; } r.rank = r.n > 0 ? rank : null; });
  return arr;
}

// ---------------- 거북이 레이스 ----------------
const lastCount = new Map();
function renderRace(el, myKey){
  const goal = room?.goal || 10;
  const list = ranked().sort((a, b) => String(a.studentId).localeCompare(String(b.studentId), 'ko', { numeric: true }));
  if (!list.length){ el.innerHTML = '<div class="empty">아직 들어온 학생이 없어요. 방 번호를 알려 주세요!</div>'; return; }
  const top = Math.max(0, ...list.map(s => s.n));
  // 레인 재사용 (애니메이션 유지)
  const existing = new Map([...el.querySelectorAll('.lane')].map(l => [l.dataset.key, l]));
  el.querySelector('.empty')?.remove();
  list.forEach((s, i) => {
    let lane = existing.get(s.key);
    if (!lane){
      lane = document.createElement('div'); lane.className = 'lane'; lane.dataset.key = s.key;
      lane.innerHTML = '<div class="label"></div><div class="road"><div class="turtle"><span class="crown"></span><span class="t">🐢</span><span class="cnt"></span></div></div><div class="finish"></div>';
    }
    existing.delete(s.key);
    if (el.children[i] !== lane) el.insertBefore(lane, el.children[i] || null);
    lane.classList.toggle('me', s.key === myKey);
    lane.querySelector('.label').innerHTML = `${esc(s.name)}<small>${esc(s.studentId)}</small>`;
    const p = Math.min(s.n / goal, 1);
    const tu = lane.querySelector('.turtle');
    tu.style.left = `calc(${(p * 100).toFixed(2)}% - ${(p * 64).toFixed(1)}px)`;
    tu.querySelector('.cnt').textContent = s.n >= goal ? `${s.n} 🏁` : s.n;
    tu.querySelector('.crown').textContent = (top > 0 && s.n === top) ? '👑' : '';
    const k = (room?.round || '') + '|' + s.key;
    const before = lastCount.get(k);
    if (before !== undefined && s.n > before){ tu.classList.remove('crawl'); void tu.offsetWidth; tu.classList.add('crawl'); }
    lastCount.set(k, s.n);
  });
  existing.forEach(l => l.remove());
}

// ---------------- 결과 ----------------
let shownResultFor = null;
function showResults(celebrate){
  const r = ranked();
  const players = r.filter(x => x.n > 0);
  const total = r.reduce((a, x) => a + x.n, 0);
  $('resSub').textContent = room?.pair ? `초성 ${room.pair[0]}${room.pair[1]} · 참가 ${r.length}명 · 단어 ${total}개` : '아직 진행한 판이 없어요';
  const groups = [1, 2, 3].map(k => players.filter(x => x.rank === k));
  const col = (k, cls) => {
    const g = groups[k - 1];
    const skipped = !g.length && players.filter(x => x.rank < k).length >= k;
    return `<div class="pcol ${cls}${g.length ? '' : ' none'}">
      <div class="names">${g.length ? g.map(x => esc(x.name)).join('<br>') : (skipped ? '<span style="font-size:16px">공동 순위로<br>건너뜀</span>' : '—')}</div>
      <div class="n">${g.length ? g[0].n + '개' : ''}</div><div class="step">${k}</div></div>`;
  };
  $('podium').innerHTML = col(2, 'p2') + col(1, 'p1') + col(3, 'p3');
  const top = players.filter(x => x.rank <= 3);
  $('detail').innerHTML = top.length
    ? top.map(x => `<div class="row"><b>${x.rank}등 ${esc(x.studentId)} ${esc(x.name)}</b><span>${x.valid.map(esc).join(', ')}</span></div>`).join('')
    : '<div class="row"><span>단어를 쓴 학생이 없어요.</span></div>';
  $('resOverlay').classList.add('show');
  if (celebrate && players.length) confetti();
}
function hideResults(){ $('resOverlay').classList.remove('show'); }
$('resClose').onclick = hideResults;
$('resOverlay').addEventListener('click', e => { if (e.target === $('resOverlay')) hideResults(); });
function confetti(){
  const colors = ['#ff6b4a','#3d7cf0','#f5b301','#2fb67c','#c86bfa'];
  for (let i = 0; i < 80; i++){
    const d = document.createElement('div'); d.className = 'confetti';
    d.style.left = Math.random() * 100 + 'vw'; d.style.background = colors[i % 5];
    d.style.animationDuration = (2 + Math.random() * 2) + 's'; d.style.animationDelay = Math.random() * .6 + 's';
    document.body.appendChild(d); setTimeout(() => d.remove(), 5000);
  }
}

  unsubs.push(store.watchStudents(p, list => {
    students = list;
    if (mode === 'teacher') T.onStudents(); else S.onStudents();
  }, e => console.error(e)));
}

const T = (() => {
  const t1 = $('t1'), t2 = $('t2'), drawBtn = $('draw');
  const bar = $('bar'), timeEl = $('time'), ring = $('ring'), goBtn = $('go');
  const C = 2 * Math.PI * 52; bar.style.strokeDasharray = C;
  let total = 60, remain = 60, running = false, endAt = 0, raf = null, lastWhole = null, drawing = false, over = false;
  const save = writer(d => store.setRoom(pin, d));

  function enter(p){
    pin = p; mode = 'teacher'; room = null; students = [];
    $('tPin').textContent = p; show('sTeacher');
    [t1, t2].forEach(t => { t.className = t.className.replace(/ ?(done|pop|spin)/g, '') + ' empty'; t.textContent = '?'; });
    drawBtn.textContent = '초성 뽑기!';
    restored = false; listen(p); renderRace($('tTrack'));
  }
  let restored = false;
  function onRoom(){
    if (!restored){
      restored = true;
      total = room.duration || 60; $('goal').value = String(room.goal || 10);
      document.querySelectorAll('#presets button').forEach(b => b.classList.toggle('on', +b.dataset.s === total));
      if (room.pair){ setTiles(room.pair); drawBtn.textContent = '다시 뽑기!'; }
      if (room.status === 'running' && room.endsAt > Date.now()){ remain = (room.endsAt - Date.now()) / 1000; startLocal(); }
      else if (room.status === 'paused'){ remain = (room.remainMs || 0) / 1000; goBtn.textContent = '계속'; }
      else if (room.status === 'ended'){ remain = 0; over = true; }
      else remain = total;
      render();
    }
    renderRace($('tTrack')); updateInfo();
  }
  function onStudents(){ renderRace($('tTrack')); updateInfo(); }
  function updateInfo(){
    $('tCount').textContent = `참가 ${students.length}명`;
    $('tRaceInfo').textContent = `단어 1개 = 한 걸음 · ${room?.goal || 10}개면 결승선!`;
  }
  function setTiles(p){ [[t1, p[0]], [t2, p[1]]].forEach(([el, c]) => { el.classList.remove('empty', 'spin'); el.classList.add('done'); el.textContent = c; }); }

  const pool = () => $('optEasy').checked ? ALL.filter(c => !HARD.includes(c)) : ALL;
  function spinTile(el, final, ms){
    return new Promise(res => {
      el.classList.remove('empty', 'done', 'pop'); el.classList.add('spin');
      const p = pool(), start = performance.now(); let last = 0;
      (function step(now){
        const t = now - start;
        if (now - last > 50 + (t / ms) * 140){ el.textContent = pick(p); last = now; beep(400 + Math.random() * 300, .03, .05); }
        if (t < ms) requestAnimationFrame(step);
        else { el.textContent = final; el.classList.remove('spin'); void el.offsetWidth; el.classList.add('done', 'pop'); beep(880, .15, .15, 'triangle'); res(); }
      })(start);
    });
  }
  async function draw(){
    if (drawing) return;
    drawing = true; drawBtn.disabled = true; audio(); hideResults();
    stopLocal(); remain = total; over = false; render();
    const p = pool(); const a = pick(p); let b = pick(p);
    if ($('optSame').checked) while (b === a) b = pick(p);
    const round = Date.now().toString(36);
    save({ round, pair: null, status: 'drawing', remainMs: total * 1000, duration: total, goal: +$('goal').value });
    await Promise.all([spinTile(t1, a, 1100), spinTile(t2, b, 1700)]);
    save({ pair: [a, b], status: 'ready' });
    drawing = false; drawBtn.disabled = false; drawBtn.textContent = '다시 뽑기!';
    if ($('optAuto').checked) start();
  }

  function render(){
    const frac = total > 0 ? Math.max(0, remain / total) : 0;
    bar.style.strokeDashoffset = C * (1 - frac);
    bar.style.stroke = frac > .5 ? 'var(--ok)' : frac > .2 ? 'var(--warn)' : 'var(--danger)';
    ring.classList.toggle('ending', running && remain <= 5 && remain > 0);
    if (over){ timeEl.textContent = '시간 끝!'; ring.classList.add('over'); }
    else { timeEl.textContent = fmt(remain); ring.classList.remove('over'); }
  }
  function tick(){
    remain = (endAt - performance.now()) / 1000;
    const w = Math.ceil(remain);
    if (w !== lastWhole){ if (w <= 5 && w > 0) beep(700, .1, .12); lastWhole = w; }
    if (remain <= 0){ finish(); return; }
    render(); raf = requestAnimationFrame(tick);
  }
  function startLocal(){
    running = true; over = false; endAt = performance.now() + remain * 1000; lastWhole = null;
    goBtn.textContent = '멈춤'; goBtn.classList.add('pause');
    cancelAnimationFrame(raf); raf = requestAnimationFrame(tick);
  }
  function stopLocal(){ running = false; cancelAnimationFrame(raf); goBtn.textContent = '시작'; goBtn.classList.remove('pause'); }
  function start(){
    audio();
    if (!room?.pair) return toast('먼저 초성을 뽑아 주세요.', true);
    if (remain <= 0) remain = total;
    startLocal();
    save({ status: 'running', endsAt: Date.now() + remain * 1000, duration: total });
  }
  function pause(){
    stopLocal(); goBtn.textContent = '계속'; render();
    save({ status: 'paused', remainMs: Math.round(remain * 1000) });
  }
  function finish(){
    stopLocal(); remain = 0; over = true; render();
    save({ status: 'ended', remainMs: 0 });
    $('timerPanel').classList.remove('flash'); void $('timerPanel').offsetWidth; $('timerPanel').classList.add('flash');
    [0, 250, 500].forEach((d, i) => setTimeout(() => beep(i === 2 ? 1046 : 784, .35, .2, 'triangle'), d));
    setTimeout(() => showResults(true), 1200); // 학생들의 마지막 입력이 도착할 시간을 조금 기다린다
  }
  function reset(){
    stopLocal(); remain = total; over = false; render();
    if (pin) save({ status: room?.pair ? 'ready' : 'idle', remainMs: total * 1000, duration: total });
  }
  function setTotal(s){
    total = Math.max(10, Math.min(600, s));
    document.querySelectorAll('#presets button').forEach(b => b.classList.toggle('on', +b.dataset.s === total));
    reset();
  }

  drawBtn.onclick = draw;
  goBtn.onclick = () => running ? pause() : start();
  $('reset').onclick = reset;
  $('plus').onclick = () => { if (running){ endAt += 10000; total += 10; save({ endsAt: Date.now() + (remain + 10) * 1000 }); } else setTotal(total + 10); };
  $('minus').onclick = () => { if (running){ if (remain > 11){ endAt -= 10000; total = Math.max(10, total - 10); save({ endsAt: Date.now() + (remain - 10) * 1000 }); } } else setTotal(total - 10); };
  document.querySelectorAll('#presets button').forEach(b => b.onclick = () => setTotal(+b.dataset.s));
  $('goal').onchange = () => save({ goal: +$('goal').value });
  $('tResult').onclick = () => showResults(false);

  let armT = null; const kick = $('tKick');
  kick.onclick = async () => {
    if (!kick.classList.contains('armed')){
      kick.classList.add('armed'); kick.textContent = '한 번 더 누르면 모두 내보내요';
      armT = setTimeout(() => { kick.classList.remove('armed'); kick.textContent = '참가자 모두 내보내기'; }, 3000); return;
    }
    clearTimeout(armT); kick.classList.remove('armed'); kick.textContent = '참가자 모두 내보내기';
    try { await store.clearStudents(pin); toast('참가자를 모두 내보냈어요.'); } catch (e){ console.error(e); toast('내보내기에 실패했어요.', true); }
  };

  document.addEventListener('keydown', e => {
    if (mode !== 'teacher' || ['INPUT','BUTTON','SELECT'].includes(e.target.tagName)) return;
    if (e.code === 'Space'){ e.preventDefault(); draw(); }
    else if (e.code === 'Enter'){ e.preventDefault(); running ? pause() : start(); }
  });

  render();
  return { enter, onRoom, onStudents, stopLocal };
})();

// ============================================================
// 학생
// ============================================================
const S = (() => {
  const wordIn = $('word'), wordBtn = $('wordBtn');
  let key = null, sid = null, name = null, myRound = null, myWords = [], loop = null, restored = false;
  let save = null;

  function enter(p, k, s, n){
    pin = p; key = k; sid = s; name = n; mode = 'student'; room = null; students = [];
    myRound = null; myWords = []; restored = false; shownResultFor = null;
    save = writer(d => store.setStudent(pin, key, d));
    $('sWho').innerHTML = `🐢 ${esc(sid)} ${esc(name)}<small>방 ${esc(p)}</small>`;
    $('msg').textContent = ''; renderMine();
    show('sStudent'); listen(p);
    cancelAnimationFrame(loop); loop = requestAnimationFrame(clock);
  }

  function onRoom(prevRound){
    if (room.round !== myRound){ myRound = room.round; myWords = []; restored = false; tryRestore(); renderMine(); $('msg').textContent = ''; }
    const p = room.pair;
    [['s1', 0], ['s2', 1]].forEach(([id, i]) => {
      const el = $(id);
      if (p){ if (el.textContent !== p[i] || el.classList.contains('empty')){ el.classList.remove('empty', 'spin'); el.textContent = p[i]; el.classList.remove('pop'); void el.offsetWidth; el.classList.add('done', 'pop'); } }
      else { el.classList.remove('done', 'pop'); el.classList.add(room.status === 'drawing' ? 'spin' : 'empty'); el.textContent = '?'; }
    });
    if (room.status === 'ended' && room.round && shownResultFor !== room.round){ shownResultFor = room.round; setTimeout(() => showResults(true), 1500); }
    if (room.status !== 'ended') hideResultsIfNew(prevRound);
    gate(); renderRace($('sTrack'), key); $('sRaceInfo').textContent = `${room.goal || 10}개면 결승선!`;
  }
  function hideResultsIfNew(prev){ if (prev !== undefined && prev !== room.round) hideResults(); }
  function onStudents(){
    if (!students.find(s => s.key === key) && room){ /* 선생님이 내보낸 경우 */
      if (students.length === 0 && myWords.length === 0){ toast('선생님이 참가자를 정리했어요. 다시 입장해 주세요.', true); leave(); return; }
    }
    tryRestore(); renderRace($('sTrack'), key);
  }
  // 새로고침 후 내가 쓴 단어 되살리기
  function tryRestore(){
    if (restored || !room) return;
    const me = students.find(s => s.key === key);
    if (!me) return;
    restored = true;
    if (me.round === room.round && Array.isArray(me.words) && myWords.length === 0){ myWords = me.words.slice(); renderMine(); }
  }

  const canType = () => room && room.pair && room.status === 'running';
  function gate(){
    const st = $('sStatus'); const ok = canType();
    if (!room || room.status === 'idle') st.textContent = '선생님이 초성을 뽑을 때까지 기다려 주세요.';
    else if (room.status === 'drawing') st.textContent = '초성을 뽑는 중… 두근두근!';
    else if (ok) st.textContent = '시작! 초성에 맞는 두 글자 단어를 쓰세요.';
    else if (room.status === 'ended') st.textContent = '시간 끝! 결과를 확인하세요.';
    else st.textContent = '곧 시작해요. 준비!';
    st.classList.toggle('live', !!ok);
    const was = wordIn.disabled;
    wordIn.disabled = !ok; wordBtn.disabled = !ok;
    if (!ok) wordIn.value = '';
    if (ok && was) wordIn.focus();
  }
  function clock(){
    const el = $('sTime');
    if (room){
      let s = null;
      if (room.status === 'running') s = (room.endsAt - Date.now()) / 1000;
      else if (room.status === 'paused' || room.status === 'ready' || room.status === 'drawing') s = (room.remainMs || 0) / 1000;
      else if (room.status === 'ended') s = 0;
      el.textContent = s === null ? '-:--' : (room.status === 'ended' ? '시간 끝!' : fmt(s) + (room.status === 'paused' ? ' ⏸' : ''));
      el.classList.toggle('ending', room.status === 'running' && s <= 5);
    }
    loop = requestAnimationFrame(clock);
  }

  function say(t, k){ const m = $('msg'); m.textContent = t; m.className = 'msg ' + (k || ''); }
  function flash(cls){ wordIn.classList.remove('bad', 'good'); void wordIn.offsetWidth; wordIn.classList.add(cls); setTimeout(() => wordIn.classList.remove(cls), 700); }
  function renderMine(){
    $('myN').textContent = myWords.length;
    $('myWords').innerHTML = myWords.map((w, i) => `<span class="word">${esc(w)}<span class="x" data-i="${i}">✕</span></span>`).join('');
  }
  function push(){ save({ studentId: sid, name, round: room.round, words: myWords.slice(), updatedAt: Date.now() }); }

  $('wordForm').addEventListener('submit', e => {
    e.preventDefault(); audio();
    if (!canType()) return;
    const w = wordIn.value.trim().replace(/\s+/g, '');
    if (!w) return;
    const c = [...w], p = room.pair; let err = null;
    if (c.length !== 2) err = '두 글자 단어만 쓸 수 있어요.';
    else if (!c.every(choOf)) err = '완성된 한글로 써 주세요.';
    else if (choOf(c[0]) !== p[0] || choOf(c[1]) !== p[1]) err = `초성이 달라요! (${choOf(c[0])}${choOf(c[1])} → ${p[0]}${p[1]})`;
    else if (myWords.includes(w)) err = `‘${w}’은(는) 이미 썼어요.`;
    if (err){ say(err, 'err'); flash('bad'); beep(200, .15, .12); wordIn.select(); return; }
    myWords.push(w); push();
    say(`‘${w}’ 통과! 거북이가 한 걸음 🐢`, 'ok'); flash('good'); beep(988, .08, .1, 'triangle');
    wordIn.value = ''; wordIn.focus(); renderMine();
  });
  $('myWords').addEventListener('click', e => {
    const x = e.target.closest('.x'); if (!x || !canType()) return;
    myWords.splice(+x.dataset.i, 1); push(); renderMine();
  });
  return { enter, onRoom, onStudents };
})();

// ---------------- 시작 ----------------
refreshReopen();
makeStore().then(s => { store = s; $('conn').textContent = '✅ 서버 연결 완료'; })
  .catch(err => { console.error(err); const c = $('conn'); c.textContent = '서버 연결 실패: Firebase 설정과 익명 로그인 사용 여부를 확인하세요.'; c.classList.add('err'); });
</script>
