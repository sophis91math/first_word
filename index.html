<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘의 초성게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fff8ec; --ink:#2b2335; --card:#ffffff; --accent:#ff6b4a; --accent2:#3d7cf0;
    --soft:#ffe8cc; --muted:#8a8095; --ok:#2fb67c; --warn:#f2a516; --danger:#e8453c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg);
    background-image:radial-gradient(circle at 10% 10%, #ffe1c2 0 120px, transparent 121px),
                     radial-gradient(circle at 95% 90%, #dbe7ff 0 160px, transparent 161px);
    color:var(--ink); font-family:'Noto Sans KR',sans-serif;
    display:flex; flex-direction:column; align-items:center; padding:24px 16px 40px;
  }
  h1{font-family:'Jua',sans-serif; font-weight:400; font-size:clamp(34px,6vw,64px); margin:8px 0 22px; letter-spacing:1px; text-align:center}
  h1 .q{color:var(--accent); display:inline-block; animation:bob 1.6s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-6px) rotate(8deg)}}

  .wrap{display:grid; grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr); gap:22px; width:100%; max-width:1180px}
  @media (max-width:820px){.wrap{grid-template-columns:1fr}}
  .panel{background:var(--card); border-radius:28px; padding:28px; box-shadow:0 10px 0 #f1dcc0, 0 18px 40px rgba(60,40,20,.08)}

  /* 초성 카드 */
  .tiles{display:flex; justify-content:center; gap:clamp(14px,3vw,32px); margin:6px 0 26px}
  .tile{
    width:clamp(130px,22vw,230px); aspect-ratio:1; border-radius:28px;
    background:linear-gradient(160deg,#fff 0%,#fff3e3 100%);
    border:5px solid var(--ink); box-shadow:0 10px 0 var(--ink);
    display:flex; align-items:center; justify-content:center;
    font-family:'Jua',sans-serif; font-size:clamp(84px,15vw,170px); line-height:1;
    position:relative; overflow:hidden; user-select:none;
  }
  .tile.spin{color:var(--muted)}
  .tile.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
  .tile:nth-child(1).done{color:var(--accent)}
  .tile:nth-child(2).done{color:var(--accent2)}
  @keyframes pop{0%{transform:scale(.7)}100%{transform:scale(1)}}
  .tile.empty{color:#e3d6c6}

  .btnrow{display:flex; gap:12px; justify-content:center; flex-wrap:wrap}
  button{font-family:'Jua',sans-serif; font-size:22px; border:none; cursor:pointer; border-radius:18px; padding:14px 26px; transition:transform .08s, box-shadow .08s}
  button:active{transform:translateY(4px)}
  .big{background:var(--accent); color:#fff; font-size:30px; padding:16px 44px; box-shadow:0 6px 0 #c94a2d}
  .big:active{box-shadow:0 2px 0 #c94a2d}
  .big:disabled{opacity:.6; cursor:default}

  .opts{display:flex; gap:10px 18px; flex-wrap:wrap; justify-content:center; margin-top:22px; color:var(--muted); font-size:15px}
  .opts label{display:flex; align-items:center; gap:6px; cursor:pointer}
  .opts input{width:18px; height:18px; accent-color:var(--accent)}

  .history{margin-top:22px; border-top:2px dashed #eadbc8; padding-top:16px}
  .history h3{margin:0 0 10px; font-family:'Jua',sans-serif; font-weight:400; font-size:20px; color:var(--muted)}
  .chips{display:flex; flex-wrap:wrap; gap:8px; min-height:36px}
  .chip{font-family:'Jua',sans-serif; font-size:20px; background:var(--soft); padding:4px 14px; border-radius:999px}
  .chips .none{color:#c8bba9; font-size:14px; align-self:center}

  /* 타이머 */
  .timer{display:flex; flex-direction:column; align-items:center}
  .timer h2{font-family:'Jua',sans-serif; font-weight:400; font-size:28px; margin:0 0 14px}
  .ring{position:relative; width:min(260px,70vw); aspect-ratio:1}
  .ring svg{width:100%; height:100%; transform:rotate(-90deg)}
  .ring .track{stroke:#f1e6d8}
  .ring .bar{stroke:var(--ok); transition:stroke-dashoffset .25s linear, stroke .3s}
  .ring .time{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:'Jua',sans-serif; font-size:clamp(56px,9vw,78px)}
  .ring.ending .time{color:var(--danger); animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.08)}}
  .ring.over .time{font-size:clamp(36px,6vw,48px); color:var(--danger)}

  .adj{display:flex; align-items:center; gap:10px; margin:18px 0 10px}
  .adj button{background:var(--soft); color:var(--ink); padding:8px 16px; font-size:20px; box-shadow:0 4px 0 #ecd0ab}
  .presets{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-bottom:16px}
  .presets button{background:#eef3ff; color:var(--accent2); font-size:18px; padding:8px 14px; box-shadow:0 4px 0 #cbd9fb}
  .presets button.on{background:var(--accent2); color:#fff; box-shadow:0 4px 0 #2a5bc0}
  .tctl{display:flex; gap:10px}
  .tctl .go{background:var(--ok); color:#fff; box-shadow:0 6px 0 #1f8a5b; min-width:130px}
  .tctl .go.pause{background:var(--warn); box-shadow:0 6px 0 #c4850b}
  .tctl .reset{background:#efe9f2; color:var(--ink); box-shadow:0 6px 0 #d4c9da}

  .flash{animation:flash .5s ease 3}
  @keyframes flash{50%{background:#ffe0dc}}
  footer{margin-top:22px; color:var(--muted); font-size:13px; text-align:center}
</style>
</head>
<body>

<h1>오늘의 초성게임은<span class="q">?</span></h1>

<div class="wrap">
  <section class="panel">
    <div class="tiles">
      <div class="tile empty" id="t1">?</div>
      <div class="tile empty" id="t2">?</div>
    </div>
    <div class="btnrow">
      <button class="big" id="draw">초성 뽑기!</button>
    </div>
    <div class="opts">
      <label><input type="checkbox" id="optEasy"> 어려운 초성(ㅋ·ㅌ·ㅍ) 빼기</label>
      <label><input type="checkbox" id="optSame"> 같은 초성 두 번 안 나오게</label>
      <label><input type="checkbox" id="optAuto" checked> 뽑으면 타이머 자동 시작</label>
    </div>
    <div class="history">
      <h3>지금까지 나온 초성</h3>
      <div class="chips" id="hist"><span class="none">아직 없어요</span></div>
    </div>
  </section>

  <section class="panel timer" id="timerPanel">
    <h2>⏱ 타이머</h2>
    <div class="ring" id="ring">
      <svg viewBox="0 0 120 120">
        <circle class="track" cx="60" cy="60" r="52" fill="none" stroke-width="12"/>
        <circle class="bar" id="bar" cx="60" cy="60" r="52" fill="none" stroke-width="12" stroke-linecap="round"/>
      </svg>
      <div class="time" id="time">1:00</div>
    </div>
    <div class="adj">
      <button id="minus">−10초</button>
      <button id="plus">+10초</button>
    </div>
    <div class="presets" id="presets">
      <button data-s="30">30초</button>
      <button data-s="60" class="on">1분</button>
      <button data-s="90">1분 30초</button>
      <button data-s="120">2분</button>
      <button data-s="180">3분</button>
    </div>
    <div class="tctl">
      <button class="go" id="go">시작</button>
      <button class="reset" id="reset">처음으로</button>
    </div>
  </section>
</div>

<footer>스페이스바: 초성 뽑기 · Enter: 타이머 시작/멈춤</footer>

<script>
(() => {
  const ALL = ['ㄱ','ㄴ','ㄷ','ㄹ','ㅁ','ㅂ','ㅅ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  const HARD = ['ㅋ','ㅌ','ㅍ'];
  const t1 = document.getElementById('t1'), t2 = document.getElementById('t2');
  const drawBtn = document.getElementById('draw');
  const hist = document.getElementById('hist');
  const optEasy = document.getElementById('optEasy'), optSame = document.getElementById('optSame'), optAuto = document.getElementById('optAuto');
  const history = [];
  let drawing = false;

  const pool = () => optEasy.checked ? ALL.filter(c => !HARD.includes(c)) : ALL;
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];

  // ---- 소리 ----
  let ctx = null;
  function audio(){ try{ if(!ctx) ctx = new (window.AudioContext||window.webkitAudioContext)(); if(ctx.state==='suspended') ctx.resume(); }catch(e){ ctx=null; } return ctx; }
  function beep(freq=660, dur=0.08, vol=0.15, type='square'){
    const a = ctx; if(!a) return;
    try{
      const o = a.createOscillator(), g = a.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, a.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
      o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime + dur);
    }catch(e){}
  }

  // ---- 초성 뽑기 ----
  function spinTile(el, final, ms){
    return new Promise(res => {
      el.classList.remove('empty','done','pop'); el.classList.add('spin');
      const p = pool(); const start = performance.now(); let last = 0;
      (function step(now){
        const t = now - start;
        const interval = 50 + (t / ms) * 140; // 점점 느려짐
        if (now - last > interval){ el.textContent = pick(p); last = now; beep(400 + Math.random()*300, .03, .05); }
        if (t < ms) requestAnimationFrame(step);
        else {
          el.textContent = final; el.classList.remove('spin');
          void el.offsetWidth; el.classList.add('done','pop'); beep(880, .15, .15, 'triangle'); res();
        }
      })(start);
    });
  }

  async function draw(){
    if (drawing) return;
    drawing = true; drawBtn.disabled = true; audio();
    const p = pool();
    const a = pick(p);
    let b = pick(p);
    if (optSame.checked) while (b === a) b = pick(p);
    await Promise.all([spinTile(t1, a, 1100), spinTile(t2, b, 1700)]);
    history.unshift(a + b);
    renderHist();
    drawing = false; drawBtn.disabled = false; drawBtn.textContent = '다시 뽑기!';
    if (optAuto.checked){ resetTimer(); startTimer(); }
  }

  function renderHist(){
    hist.innerHTML = history.length ? history.slice(0, 20).map(h => `<span class="chip">${h}</span>`).join('') : '<span class="none">아직 없어요</span>';
  }

  drawBtn.addEventListener('click', draw);

  // ---- 타이머 ----
  const bar = document.getElementById('bar'), timeEl = document.getElementById('time'), ring = document.getElementById('ring');
  const goBtn = document.getElementById('go'), panel = document.getElementById('timerPanel');
  const C = 2 * Math.PI * 52;
  bar.style.strokeDasharray = C;
  let total = 60, remain = 60, running = false, endAt = 0, raf = null, lastWhole = null;

  const fmt = s => { s = Math.max(0, Math.ceil(s)); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); };

  function render(){
    const frac = total > 0 ? Math.max(0, remain / total) : 0;
    bar.style.strokeDashoffset = C * (1 - frac);
    bar.style.stroke = frac > .5 ? 'var(--ok)' : frac > .2 ? 'var(--warn)' : 'var(--danger)';
    ring.classList.toggle('ending', running && remain <= 5 && remain > 0);
    if (remain <= 0 && total > 0 && !running && ring.dataset.over === '1'){ timeEl.textContent = '시간 끝!'; ring.classList.add('over'); }
    else { timeEl.textContent = fmt(remain); ring.classList.remove('over'); }
  }

  function tick(){
    remain = (endAt - performance.now()) / 1000;
    const whole = Math.ceil(remain);
    if (whole !== lastWhole){ if (whole <= 5 && whole > 0) beep(700, .1, .12); lastWhole = whole; }
    if (remain <= 0){ finish(); return; }
    render(); raf = requestAnimationFrame(tick);
  }

  function startTimer(){
    audio();
    if (remain <= 0) remain = total;
    if (remain <= 0) return;
    ring.dataset.over = '0';
    running = true; endAt = performance.now() + remain * 1000; lastWhole = null;
    goBtn.textContent = '멈춤'; goBtn.classList.add('pause');
    cancelAnimationFrame(raf); raf = requestAnimationFrame(tick);
  }
  function pauseTimer(){
    running = false; cancelAnimationFrame(raf);
    goBtn.textContent = '계속'; goBtn.classList.remove('pause'); render();
  }
  function finish(){
    running = false; remain = 0; cancelAnimationFrame(raf); ring.dataset.over = '1';
    goBtn.textContent = '시작'; goBtn.classList.remove('pause'); render();
    panel.classList.remove('flash'); void panel.offsetWidth; panel.classList.add('flash');
    [0, 250, 500].forEach((d,i) => setTimeout(() => beep(i===2 ? 1046 : 784, .35, .2, 'triangle'), d));
  }
  function resetTimer(){
    running = false; cancelAnimationFrame(raf); remain = total; ring.dataset.over = '0';
    goBtn.textContent = '시작'; goBtn.classList.remove('pause'); render();
  }
  function setTotal(s){
    total = Math.max(10, Math.min(600, s));
    document.querySelectorAll('#presets button').forEach(b => b.classList.toggle('on', +b.dataset.s === total));
    resetTimer();
  }

  goBtn.addEventListener('click', () => running ? pauseTimer() : startTimer());
  document.getElementById('reset').addEventListener('click', resetTimer);
  document.getElementById('plus').addEventListener('click', () => {
    if (running){ endAt += 10000; total += 10; } else setTotal(total + 10);
  });
  document.getElementById('minus').addEventListener('click', () => {
    if (running){ if (remain > 11){ endAt -= 10000; total = Math.max(10, total - 10); } } else setTotal(total - 10);
  });
  document.querySelectorAll('#presets button').forEach(b => b.addEventListener('click', () => setTotal(+b.dataset.s)));

  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.code === 'Space'){ e.preventDefault(); draw(); }
    else if (e.code === 'Enter'){ e.preventDefault(); running ? pauseTimer() : startTimer(); }
  });

  render();
})();
</script>
</body>
</html>
